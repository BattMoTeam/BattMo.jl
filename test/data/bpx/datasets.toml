[schmitt_2026]
title = "HYDRA graphite/LNMO validation parameter set"
iri = "https://w3id.org/battinfo/dataset/7jnc-cjtw-5h3a-5t52"
citation = "https://arxiv.org/abs/2601.10507"
license = "CC-BY-4.0"
notes = "Tabulated OCPs and electrolyte properties, regional Bruggeman exponents 1.86 / 4.53 / 1.68, no lumped thermal parameters. The Validation section is removed (make_fixtures.py); all other content is unchanged."

