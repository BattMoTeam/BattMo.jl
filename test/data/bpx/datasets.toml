# Provenance of the BPX parameter sets and reference curves used by
# test/test_bpx_acceptance.jl. Paths are relative to this directory. The sha256
# sums are of the files with LF line endings; the tests normalise CRLF checkouts
# before hashing.

[nmc_pouch]
title = "Parameterisation example of an NMC111|graphite 12.5 Ah pouch cell (About:Energy)"
source = "https://github.com/FaradayInstitution/BPX/blob/1fa5ba0b69458007e716758f56cfb900e7e1f23b/examples/nmc_pouch_cell_BPX.json"
license = "MIT"
file = "../jsonfiles/nmc_pouch_cell_BPX.json"
sha256 = "9fea2c5a2748ac1f09e2bb32225fe4810597611a93ea57d68ed84783188f4d03"
notes = "Unchanged copy. Legacy BPX 0.1 layout, function strings only, the same Bruggeman exponent (1.5) in all regions."

[lfp_18650]
