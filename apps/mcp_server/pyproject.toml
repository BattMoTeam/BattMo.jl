[project]
name = "battmo-mcp"
version = "0.1.0"
description = "MCP server exposing BattMo.jl battery simulations to LLM clients"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "juliacall>=0.9.28",
]

[project.scripts]
battmo-mcp = "battmo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/battmo_mcp"]
